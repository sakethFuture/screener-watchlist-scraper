name: Scrape Screener Watchlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scrape job
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          HEADLESS: "true"
          MIN_DELAY_SECONDS: "3"
          MAX_DELAY_SECONDS: "7"
          LOG_LEVEL: "INFO"
        run: python scrape_job.py

      - name: Commit and push updated state/output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/output.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update scrape state/output [skip ci]"
            git push
          fi
